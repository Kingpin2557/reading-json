<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamically Reading JSON files</title>

	<link rel="stylesheet" href="./main.css">
</head>
<body>

    <main>
        <div class="c-jsonfile">
            <label for="json">Upload your json file</label>
            <input id="json" name="json" type="file" accept=".json" hidden>
        </div>

        <section class="c-jsoncontainer"></section>
    </main>

    <script src="./index.js"></script>
</body>
</html>
